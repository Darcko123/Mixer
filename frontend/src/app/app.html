<header>
  <mat-toolbar>
    <span>Mixer</span>
    <mat-button-toggle-group
      hideSingleSelectionIndicator
      aria-label="Unidad de volumen"
      [value]="units.volume()"
      (change)="units.set($event.value)"
    >
      <mat-button-toggle value="ml">ml</mat-button-toggle>
      <mat-button-toggle value="oz">oz</mat-button-toggle>
    </mat-button-toggle-group>
  </mat-toolbar>
  <!-- Sin las flechas de Material: en móvil la fila se desliza con el dedo (ver styles.scss). -->
  <nav mat-tab-nav-bar class="views" disablePagination [tabPanel]="panel" aria-label="Vistas">
    @for (view of views; track view.path) {
      <a
        mat-tab-link
        #link
        routerLink="/{{ view.path }}"
        routerLinkActive
        #active="routerLinkActive"
        [active]="active.isActive"
        (isActiveChange)="
          $event &&
            link.elementRef.nativeElement.scrollIntoView({ block: 'nearest', inline: 'nearest' })
        "
      >
        {{ view.title }}
        @if (counts()[view.path!]; as count) {
          <span class="count">{{ count }}</span>
        }
      </a>
    }
  </nav>
</header>
<main>
  <mat-tab-nav-panel #panel>
    <app-status [resource]="bar.inventory" />
    <router-outlet />
  </mat-tab-nav-panel>
</main>
