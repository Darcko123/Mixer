name: test

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Mismas credenciales que docker-compose.yml (DATABASE_URL por defecto).
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mixer
          POSTGRES_PASSWORD: mixer
          POSTGRES_DB: mixer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mixer -d mixer"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build
