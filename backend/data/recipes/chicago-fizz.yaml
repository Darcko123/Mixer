# TheCocktailDB #11242 (Alcoholic, Ordinary Drink).
slug: chicago-fizz
name: "Chicago Fizz"
method: shake
glass: highball
source: thecocktaildb
ingredients:
  - {ingredient: ron-blanco, amount: 1, unit: oz}  # Light rum — 1 oz
  - {ingredient: oporto, amount: 1, unit: oz}  # Port — 1 oz
  - {ingredient: jugo-de-limon-amarillo, amount: 0.5, unit: pieza}  # Lemon — Juice of 1/2
  - {ingredient: azucar, amount: 1, unit: tsp}  # Powdered sugar — 1 tsp
  - {ingredient: huevo, amount: 1, unit: pieza}  # Egg white — 1
  - {ingredient: agua-mineral}  # Carbonated water
instructions: "Agitar todos los ingredientes (excepto el agua carbonatada) con hielo y colar en un vaso highball sobre dos cubitos de hielo. Rellenar con agua carbonatada, remover y servir."
