# TheCocktailDB #12097 (Alcoholic, Ordinary Drink).
slug: rum-toddy
name: "Rum Toddy"
method: stir
glass: old-fashioned
source: thecocktaildb
flavors: [strong, sweet]
ingredients:
  - {ingredient: ron, amount: 2, unit: oz}  # Rum — 2 oz light or dark
  - {ingredient: azucar, amount: 2, unit: tsp}  # Powdered sugar — 2 tsp
  - {ingredient: limon-amarillo}  # Lemon peel — 1 twist of
  - {ingredient: agua, amount: 2, unit: tsp}  # Water — 2 tsp
instructions: "Disuelva el azúcar en polvo en agua en un vaso old-fashioned. Añada el ron y un cubito de hielo y remueva. Añada el toque de piel de limón y sirva."
