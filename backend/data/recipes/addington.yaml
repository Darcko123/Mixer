# TheCocktailDB #17227 (Alcoholic, Cocktail).
slug: addington
name: "Addington"
method: shake
glass: cocktail
source: thecocktaildb
flavors: [herbal, sweet]
ingredients:
  - {ingredient: vermut-rojo, amount: 3, unit: oz}  # Sweet Vermouth — 2 shots
