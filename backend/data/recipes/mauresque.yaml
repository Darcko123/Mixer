slug: mauresque
name: "Mauresque"
method: build
glass: collins
source: thecocktaildb
ingredients:
  - {ingredient: licor-anisado, amount: 3, unit: cl}  # Ricard — 3 cl
  - {ingredient: orgeat, amount: 1, unit: cl}  # Orgeat Syrup — 1 cl
  - {ingredient: agua}  # Water — Full Glass
instructions: "1 - Vierta el Ricard (o pastis) 2 - Vierta el sirope de orgeat 3 - Por último, vierta el agua y añada cubitos de hielo a su gusto. Añada los cubitos de hielo al final, de lo contrario el sirope y el pastis no se mezclan bien."
