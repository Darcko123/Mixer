slug: suffering-bastard
name: Suffering Bastard
method: shake
glass: highball
source: iba
popularity: 45
ingredients:
  # IBA: "Cognac or Brandy" → el nodo que cubre ambos.
  - {ingredient: brandy,       amount: 30, unit: ml}
  - {ingredient: ginebra,      amount: 30, unit: ml}
  - {ingredient: jugo-de-lima, amount: 15, unit: ml}
  - {ingredient: angostura,    amount: 2,  unit: dash}
  - {ingredient: ginger-beer}
garnish_text: Ramita de menta y, opcionalmente, una rodaja de naranja.
instructions: >-
  Agitar con hielo todos los ingredientes excepto la ginger beer. Verter sin colar en un
  vaso Collins y completar con ginger beer.
