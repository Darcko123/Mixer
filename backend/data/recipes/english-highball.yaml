# TheCocktailDB #11338 (Alcoholic, Ordinary Drink).
slug: english-highball
name: "English Highball"
method: stir
glass: highball
source: thecocktaildb
flavors: [dry, strong]
ingredients:
  - {ingredient: brandy, amount: 0.75, unit: oz}  # Brandy — 3/4 oz
  - {ingredient: ginebra, amount: 0.75, unit: oz}  # Gin — 3/4 oz
  - {ingredient: vermut-rojo, amount: 0.75, unit: oz}  # Sweet Vermouth — 3/4 oz
  - {ingredient: agua-mineral}  # Carbonated water
  - {ingredient: limon-amarillo}  # Lemon peel
instructions: "Vierta el brandy, la ginebra y el vermut dulce en un vaso highball sobre cubitos de hielo. Rellenar con agua carbonatada. Añadir el twist de piel de limón, remover y servir. (Si se prefiere, se puede sustituir el agua con gas por ginger ale)."
