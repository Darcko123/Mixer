# TheCocktailDB #17246 (Alcoholic, Cocktail).
slug: empellon-cocinas-fat-washed-mezcal
name: "Empellón Cocina's Fat-Washed Mezcal"
method: shake
glass: beer
source: thecocktaildb
flavors: [strong, sweet]
ingredients:
  - {ingredient: mezcal, amount: 2, unit: oz}  # Mezcal — 2 oz
  - {ingredient: creme-de-cacao, amount: 0.75, unit: oz}  # Chocolate liqueur — 3/4 oz
  - {ingredient: licor-de-cafe, amount: 0.5, unit: oz}  # Coffee liqueur — 1/2 oz
instructions: "Para que tu grasa de cerdo sea tan deliciosa como la suya, aquí tienes su adobo y qué hacer con él (también necesitarás un costillar): 4 chiles anchos, 8 chiles guajillos y 4 chiles chipotles, más 4 dientes de ajo asado, media taza de vinagre de sidra, un cuarto de cucharadita de orégano mexicano, 1 cucharadita de pimienta negra molida, un clavo entero, un cuarto de cucharadita de canela molida y media cucharadita de comino molido. Tostar los chiles secos y remojarlos en agua durante al menos una hora hasta que se rehidraten. Escurrir y desechar el líquido de remojo. Mezclar los chiles remojados con el resto de ingredientes y hacer un puré hasta que quede suave. Ahumar en frío un costillar de cerdo en una sartén grande con astillas de madera en un lado y carbón en el otro. Coloca otra sartén más pequeña con costillas de cerdo encima de la sartén con carbón y virutas de madera. Encienda el carbón con cuidado de no prender las astillas. Cubra ambas cacerolas con papel de aluminio y deje que se ahumen durante 10-15 minutos, hasta conseguir el nivel de humo deseado, luego cúbralas con adobo y envuélvalas en papel de aluminio antes de meter las costillas en el horno a 300 grados durante 7 horas. Cuando las costillas se hayan enfriado, cuele la grasa y utilícela para la infusión. Si le resulta difícil conseguir el mismo volumen de grasa, compense el resto con manteca de cerdo de un carnicero. Para obtener la misma profundidad de sabor sin las costillas, calienta la grasa en una olla con unas cucharadas de la marinada. Una vez que tengas tu tarrina de grasa de cerdo sazonada en forma líquida enfriada, vierte cantidades iguales de mezcal Ilegal Joven y de grasa en un recipiente con cierre hermético. Séllelo, agítelo bien y métalo en el congelador toda la noche. Cuando todo esté separado y congelado, viértelo a través de un chino de malla fina. Si no tienes un chino, prueba con un colador de malla fina, o si no tienes uno de esos, prueba a quitar la mayor parte de la grasa con una cuchara. Quedarán algunas gotas de grasa anaranjada en el mezcal colado: pásalo por unas cuantas capas de estopilla (o filtros de café en su defecto) para deshacerte de lo que quede de ella. El mezcal ya está listo para beber, solo o en cóctel. Tintura de habanero Corta los habaneros en rodajas y añade 2 onzas de mezcal Ilegal Joven. Déjalo reposar toda la noche o hasta que alcance el nivel de picante deseado. Cóctel Mezcle el mezcal y el licor de chocolate en un vaso mezclador con hielo y remueva durante 45 segundos. Colar en una copa fría. Con cuidado, \"hundir\" el licor de café en el interior de la copa con una cuchara. Decorar con 5 gotas de tintura de habanero."
