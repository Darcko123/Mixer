# TheCocktailDB #11391 (Alcoholic, Ordinary Drink).
slug: frozen-pineapple-daiquiri
name: "Frozen Pineapple Daiquiri"
method: blend
glass: cocktail
source: thecocktaildb
ingredients:
  - {ingredient: ron-blanco, amount: 1.5, unit: oz}  # Light rum — 1 1/2 oz
  - {ingredient: pina, amount: 4, unit: pieza}  # Pineapple — 4 chunks
  - {ingredient: jugo-de-lima, amount: 1, unit: tbsp}  # Lime juice — 1 tblsp
  - {ingredient: azucar, amount: 0.5, unit: tsp}  # Sugar — 1/2 tsp
instructions: "Mezcle todos los ingredientes con 1 taza de hielo picado en una batidora eléctrica. Bata a velocidad baja durante un breve espacio de tiempo. Verter en una copa de cóctel y servir."
