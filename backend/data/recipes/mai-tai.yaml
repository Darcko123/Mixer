  - {ingredient: ron-anejo,     amount: 30, unit: ml}
  - {ingredient: curacao,       amount: 15, unit: ml}
  - {ingredient: orgeat,        amount: 15, unit: ml}
  - {ingredient: jugo-de-lima,  amount: 30, unit: ml}
