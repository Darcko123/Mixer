# TheCocktailDB #11566 (Alcoholic, Ordinary Drink).
slug: jewel-of-the-nile
name: "Jewel Of The Nile"
method: stir
glass: cocktail
source: thecocktaildb
ingredients:
  - {ingredient: ginebra, amount: 1.5, unit: oz}  # Gin — 1 1/2 oz
  - {ingredient: chartreuse-verde, amount: 0.5, unit: oz}  # Green Chartreuse — 1/2 oz
  - {ingredient: chartreuse-amarilla, amount: 0.5, unit: oz}  # Yellow Chartreuse — 1/2 oz
instructions: "En un vaso mezclador lleno hasta la mitad con cubitos de hielo, mezcle todos los ingredientes. Remover bien. Colar en una copa de cóctel."
