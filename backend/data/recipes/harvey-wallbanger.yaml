# TheCocktailDB #11462 (Alcoholic, Ordinary Drink).
slug: harvey-wallbanger
name: "Harvey Wallbanger"
method: stir
glass: collins
source: thecocktaildb
flavors: [fruity, herbal]
ingredients:
  - {ingredient: vodka, amount: 1, unit: oz}  # Vodka — 1 oz
