slug: whiskey-sour
name: Whiskey Sour
aliases: [Whisky Sour]
method: shake
glass: cobbler
source: iba
popularity: 85
ingredients:
  - {ingredient: bourbon,                amount: 45, unit: ml}
  - {ingredient: jugo-de-limon-amarillo, amount: 25, unit: ml}
  - {ingredient: jarabe-simple,          amount: 20, unit: ml}
  - {ingredient: huevo, role: optional}
garnish_text: Media rodaja de naranja y cereza marrasquino; opcionalmente piel de naranja.
instructions: >-
  Agitar todos los ingredientes con hielo y colar en copa cobbler. Para servir en las rocas,
  colar en vaso old fashioned con hielo. Si se añaden unas gotas de clara de huevo, agitar
  con más fuerza para incorporar la espuma.
