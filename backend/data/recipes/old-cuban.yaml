slug: old-cuban
name: Old Cuban
method: shake
glass: cocktail
source: iba
popularity: 50
flavors: [sour, sweet, herbal]
ingredients:
  - {ingredient: menta,         amount: 7,  unit: hoja}
  - {ingredient: ron-anejo,     amount: 45, unit: ml}
  - {ingredient: jugo-de-lima,  amount: 22, unit: ml}
  - {ingredient: jarabe-simple, amount: 30, unit: ml}
  - {ingredient: angostura,     amount: 2,  unit: dash}
