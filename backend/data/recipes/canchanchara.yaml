slug: canchanchara
name: Canchánchara
method: build
glass: old-fashioned
source: iba
popularity: 40
flavors: [sour, sweet]
ingredients:
  - {ingredient: aguardiente-de-cana, amount: 60, unit: ml}
  - {ingredient: jugo-de-lima,        amount: 15, unit: ml}
  - {ingredient: miel,                amount: 15, unit: ml}
  - {ingredient: agua,                amount: 50, unit: ml}
garnish_text: Gajo de lima.
instructions: >-
  Mezclar la miel con el agua y el jugo de lima y extender la mezcla por el fondo y las
  paredes del vaso. Añadir hielo picado y el aguardiente, y remover enérgicamente de abajo
  hacia arriba.
