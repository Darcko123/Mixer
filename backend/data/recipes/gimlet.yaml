# TheCocktailDB #17255 (Alcoholic, Cocktail).
slug: gimlet
name: "Gimlet"
method: shake
glass: cocktail
source: thecocktaildb
flavors: [strong, sour, sweet]
ingredients:
  - {ingredient: ginebra, amount: 2.5, unit: oz}  # Gin — 2 1/2 oz
  - {ingredient: jugo-de-lima, amount: 0.5, unit: oz}  # Lime Juice — 1/2 oz
  - {ingredient: jarabe-simple, amount: 0.5, unit: oz}  # Sugar Syrup — 1/2 oz
  - {ingredient: lima, amount: 1, unit: pieza}  # Lime — 1
instructions: "Añada todos los ingredientes a una coctelera y llénela de hielo. Agitar y colar en una copa de cóctel fría o en un vaso Old Fashioned lleno de hielo fresco. Decorar con una rueda de lima."
