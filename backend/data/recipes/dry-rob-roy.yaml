# TheCocktailDB #11324 (Alcoholic, Ordinary Drink).
slug: dry-rob-roy
name: "Dry Rob Roy"
method: stir
glass: cocktail
source: thecocktaildb
flavors: [strong, dry]
ingredients:
  - {ingredient: whisky-escoces, amount: 2.5, unit: oz}  # Scotch — 2 1/2 oz
  - {ingredient: vermut-seco, amount: 1.5, unit: tsp}  # Dry Vermouth — 1 1/2 tsp
  - {ingredient: limon-amarillo}  # Lemon peel — 1 twist of
instructions: "En un vaso mezclador lleno hasta la mitad con cubitos de hielo, mezcle el whisky y el vermut. Remover bien. Colar en una copa de cóctel. Decorar con el twist de limón."
