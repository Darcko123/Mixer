# TheCocktailDB #12093 (Alcoholic, Ordinary Drink).
slug: rum-sour
name: "Rum Sour"
method: shake
glass: whiskey-sour
source: thecocktaildb
flavors: [sour, sweet]
ingredients:
  - {ingredient: ron-blanco, amount: 2, unit: oz}  # Light rum — 2 oz
  - {ingredient: jugo-de-limon-amarillo, amount: 1, unit: oz}  # Lemon juice — 1 oz
  - {ingredient: azucar, amount: 0.5, unit: tsp}  # Sugar — 1/2 tsp superfine
  - {ingredient: naranja, amount: 1, unit: pieza}  # Orange — 1
  - {ingredient: cereza-marrasquino, amount: 1, unit: pieza}  # Maraschino cherry — 1
instructions: "En una coctelera llena hasta la mitad con cubitos de hielo, combine el ron, el jugo de limón y el azúcar. Agite bien. Colar en un vaso ácido y decorar con la rodaja de naranja y la cereza."
