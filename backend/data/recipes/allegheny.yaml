# TheCocktailDB #11021 (Alcoholic, Ordinary Drink).
slug: allegheny
name: "Allegheny"
method: shake
glass: cocktail
source: thecocktaildb
ingredients:
  - {ingredient: vermut-seco, amount: 1, unit: oz}  # Dry Vermouth — 1 oz
  - {ingredient: bourbon, amount: 1, unit: oz}  # Bourbon — 1 oz
  - {ingredient: creme-de-mure, amount: 1.5, unit: tsp}  # Blackberry brandy — 1 1/2 tsp
  - {ingredient: jugo-de-limon-amarillo, amount: 1.5, unit: tsp}  # Lemon juice — 1 1/2 tsp
  - {ingredient: limon-amarillo}  # Lemon peel — 1 twist of
instructions: "Agitar todos los ingredientes (excepto la piel de limón) con hielo y colar en una copa de cóctel. Añadir el twist de piel de limón y servir."
