slug: gin-fizz
name: Gin Fizz
method: shake
glass: highball
source: iba
popularity: 65
ingredients:
  - {ingredient: ginebra,                amount: 45, unit: ml}
  - {ingredient: jugo-de-limon-amarillo, amount: 30, unit: ml}
  - {ingredient: jarabe-simple,          amount: 10, unit: ml}
  - {ingredient: agua-mineral}
garnish_text: Rodaja de limón amarillo; opcionalmente piel de limón.
instructions: >-
  Agitar con hielo todos los ingredientes excepto el agua mineral. Servir sin hielo en un
  vaso alto y estrecho y completar con un chorro de agua mineral.
