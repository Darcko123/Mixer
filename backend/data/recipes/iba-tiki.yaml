slug: iba-tiki
name: IBA Tiki
method: shake
glass: tiki
source: iba
popularity: 30
ingredients:
  # IBA: Havana Club Profundo y Havana Club Smoky, 30 ml de cada uno.
  - {ingredient: ron-anejo,         amount: 60, unit: ml}
  - {ingredient: amaretto,          amount: 15, unit: ml}
  - {ingredient: licor-de-avellana, amount: 5,  unit: ml}
  - {ingredient: marrasquino,       amount: 5,  unit: gota}
  - {ingredient: pure-de-maracuya,  amount: 30, unit: ml}
  - {ingredient: jugo-de-pina,      amount: 90, unit: ml}
  - {ingredient: jugo-de-lima,      amount: 30, unit: ml}
  - {ingredient: jengibre,          amount: 1,  unit: rodaja}
garnish_text: Cítricos y una rodaja de piña deshidratada.
instructions: >-
  Machacar una rodaja fina de jengibre en la coctelera y añadir el resto de los
  ingredientes. Agitar enérgicamente con hielo y colar en un vaso tiki frío con hielo
  granizado.
