slug: daiquiri
name: Daiquirí
method: shake
glass: cocktail
source: iba
popularity: 85
ingredients:
  - {ingredient: ron-blanco,   amount: 60, unit: ml}
  - {ingredient: jugo-de-lima, amount: 20, unit: ml}
  - {ingredient: azucar,       amount: 2,  unit: barspoon}
instructions: >-
  Mezclar todos los ingredientes en la coctelera y remover hasta disolver el azúcar.
  Añadir hielo, agitar y colar en copa de cóctel fría.
