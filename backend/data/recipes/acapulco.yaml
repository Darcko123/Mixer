# TheCocktailDB #17836 (Alcoholic, Ordinary Drink).
slug: acapulco
name: "Acapulco"
method: shake
glass: old-fashioned
source: thecocktaildb
flavors: [sour, sweet, creamy]
ingredients:
  - {ingredient: ron-blanco, amount: 1.5, unit: oz}  # Light rum — 1 1/2 oz
  - {ingredient: triple-sec, amount: 1.5, unit: tsp}  # Triple sec — 1 1/2 tsp
  - {ingredient: jugo-de-lima, amount: 1, unit: tbsp}  # Lime juice — 1 tblsp
  - {ingredient: azucar, amount: 1, unit: tsp}  # Sugar — 1 tsp
  - {ingredient: huevo, amount: 1, unit: pieza}  # Egg white — 1
  - {ingredient: menta, amount: 1, unit: pieza}  # Mint — 1
instructions: "Mezclar y agitar todos los ingredientes (excepto la menta) con hielo y colar en un vaso old-fashioned sobre cubitos de hielo. Añada la ramita de menta y sirva."
