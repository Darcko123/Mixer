# TheCocktailDB #11149 (Alcoholic, Ordinary Drink).
slug: boxcar
name: "Boxcar"
method: shake
glass: whiskey-sour
source: thecocktaildb
flavors: [strong, sweet, creamy]
ingredients:
  - {ingredient: ginebra, amount: 1.5, unit: oz}  # Gin — 1 1/2 oz
  - {ingredient: triple-sec, amount: 1, unit: oz}  # Triple sec — 1 oz
  - {ingredient: jugo-de-limon-amarillo, amount: 1, unit: tsp}  # Lemon juice — 1 tsp
  - {ingredient: granadina, amount: 0.5, unit: tsp}  # Grenadine — 1/2 tsp
  - {ingredient: huevo, amount: 1, unit: pieza}  # Egg white — 1
instructions: "En una coctelera llena hasta la mitad con cubitos de hielo, mezcle todos los ingredientes. Agitar bien. Colar en un vaso sour."
