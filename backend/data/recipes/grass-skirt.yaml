# TheCocktailDB #11433 (Alcoholic, Ordinary Drink).
slug: grass-skirt
name: "Grass Skirt"
method: shake
glass: old-fashioned
source: thecocktaildb
flavors: [sweet, fruity, herbal]
ingredients:
  - {ingredient: ginebra, amount: 1.5, unit: oz}  # Gin — 1 1/2 oz
  - {ingredient: triple-sec, amount: 1, unit: oz}  # Triple sec — 1 oz
  - {ingredient: jugo-de-pina, amount: 1, unit: oz}  # Pineapple juice — 1 oz
  - {ingredient: granadina, amount: 0.5, unit: tsp}  # Grenadine — 1/2 tsp
  - {ingredient: pina, amount: 1, unit: pieza}  # Pineapple — 1
instructions: "En una coctelera llena hasta la mitad con cubitos de hielo, mezcle la ginebra, el triple sec, el zumo de piña y la granadina. Agitar bien. Verter en un vaso old fashioned y decorar con la rodaja de piña."
