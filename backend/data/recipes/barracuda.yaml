# TheCocktailDB #17209 (Alcoholic, Ordinary Drink).
slug: barracuda
name: "Barracuda"
method: shake
glass: coupe
source: thecocktaildb
flavors: [fruity, herbal]
ingredients:
  - {ingredient: ron, amount: 4.5, unit: cl}  # Rum — 4.5 cl
  - {ingredient: galliano, amount: 1.5, unit: cl}  # Galliano — 1.5 cl
  - {ingredient: jugo-de-pina, amount: 6, unit: cl}  # Pineapple Juice — 6 cl
  - {ingredient: jugo-de-lima, amount: 1, unit: dash}  # Lime Juice — 1 dash
  - {ingredient: prosecco}  # Prosecco — top up
instructions: "Agitar los ingredientes con hielo. Colar en un vaso y completar con vino espumoso."
