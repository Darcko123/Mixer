# TheCocktailDB #11662 (Alcoholic, Ordinary Drink).
slug: london-town
name: "London Town"
method: stir
glass: cocktail
source: thecocktaildb
ingredients:
  - {ingredient: ginebra, amount: 1.5, unit: oz}  # Gin — 1 1/2 oz
  - {ingredient: marrasquino, amount: 0.5, unit: oz}  # Maraschino liqueur — 1/2 oz
  - {ingredient: bitter-de-naranja, amount: 2, unit: dash}  # Orange bitters — 2 dashes
instructions: "En un vaso mezclador lleno hasta la mitad con cubitos de hielo, mezcle todos los ingredientes. Remover bien. Colar en una copa de cóctel."
