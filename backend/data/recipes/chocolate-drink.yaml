# TheCocktailDB #12734 (Non alcoholic, Cocoa).
slug: chocolate-drink
name: "Chocolate Drink"
method: build
glass: coffee-mug
source: thecocktaildb
ingredients:
  - {ingredient: chocolate}  # Chocolate — 125 gr
