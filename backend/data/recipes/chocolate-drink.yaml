instructions: "Derretir la barra en una pequeña cantidad de agua hirviendo. Agrega la leche. Cocine a fuego lento, batiendo suavemente (supongo que con un batidor) hasta que esté bien caliente. ¡No dejes que hierva! Servir en taza de café."
