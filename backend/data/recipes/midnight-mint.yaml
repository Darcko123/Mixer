instructions: "Si se dispone de ella, poner el borde de la copa de cóctel (Martini) con sirope de azúcar y luego sumergirlo en copos o polvo de chocolate. Añada los ingredientes a la coctelera con hielo. Agitar bien y colar en una copa de cóctel."
