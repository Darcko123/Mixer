# TheCocktailDB #14842 (Alcoholic, Cocktail).
slug: midnight-mint
name: "Midnight Mint"
method: shake
glass: cocktail
source: thecocktaildb
flavors: [creamy, sweet, herbal]
ingredients:
  - {ingredient: crema-irlandesa, amount: 1, unit: oz}  # Baileys irish cream — 1 oz
