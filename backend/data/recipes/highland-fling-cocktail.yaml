# TheCocktailDB #11476 (Alcoholic, Ordinary Drink).
slug: highland-fling-cocktail
name: "Highland Fling Cocktail"
method: stir
glass: cocktail
source: thecocktaildb
flavors: [strong, sweet]
ingredients:
  - {ingredient: whisky-escoces, amount: 1.5, unit: oz}  # Scotch — 1 1/2 oz
  - {ingredient: vermut-rojo, amount: 0.75, unit: oz}  # Sweet Vermouth — 3/4 oz
  - {ingredient: bitter-de-naranja, amount: 2, unit: dash}  # Orange bitters — 2 dashes
  - {ingredient: aceituna, amount: 1, unit: pieza}  # Olive — 1
instructions: "Remover todos los ingredientes (excepto la aceituna) con hielo y colar en una copa de cóctel. Añada la aceituna y sirva."
