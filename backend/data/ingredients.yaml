# Taxonomía de ingredientes de Mixer.
#
# Convenciones:
# - Equivalencia: tener un nodo satisface recetas que piden ese nodo o un ancestro.
#   Tener Tanqueray cubre "London Dry" y "Ginebra"; tener "Ginebra" no cubre "London Dry".
# - kind:
#   - category: agrupador, no se compra ni lo citan las recetas.
#   - generic: lo que citan las recetas y lo que se recomienda comprar.
#   - brand: producto concreto bajo un genérico. Los productos de un solo fabricante que las
#     recetas citan por nombre (Campari, Chartreuse, Lillet) son generic, no brand.
# - Dos hermanos NO son intercambiables (Tequila/Mezcal, Pisco/Brandy, vodka saborizado/vodka).
#   Las sustituciones se declaran aparte, de forma explícita.
# - Fruta y jugo: la fruta cuelga de su jugo. Con limas se puede hacer jugo de lima (cubre
#   recetas que piden el jugo), pero con jugo no se puede machacar una lima (Caipirinha).
# - LIMA / LIMÓN (fuente de error más probable): "limón" es lime en México y lemon en España.
#   Hay dos nodos explícitos y ninguno lleva los alias ambiguos "Limón" ni "Jugo de limón":
#   la búsqueda muestra ambos y el usuario elige. "Zumo de limón" (uso de España) sí es lemon.
# - Huevo es un solo nodo: la receta indica clara o yema en la cantidad/unidad.
# - is_staple: se asume siempre disponible (hielo, agua, azúcar, sal).
# - Los alias se normalizan con unaccent(lower()) y deben ser únicos en todo el archivo.
# - substitutes: "substitute puede reemplazar a ingredient" con pérdida de calidad. Criterio
#   conservador: solo cambios aceptados en coctelería; ante la duda, no se declara.
#   - Dirigida: la simetría se declara con dos filas. No es transitiva.
#   - quality: 3 = casi idéntico, 2 = aceptable, 1 = cambia el carácter (sabor, color o alcohol).
#   - El sustituto puede ser un ancestro: {london-dry ← ginebra} = "cualquier ginebra sirve".
#     Nunca un descendiente: eso ya lo cubre la jerarquía.
#   - Sin cambios de color que definen la bebida a la inversa (curaçao azul no sustituye a
#     curaçao) ni entre hermanos con carácter propio (Campari/Aperol, Chartreuse verde/amarilla,
#     vermut rojo/seco, Tequila/Mezcal).

